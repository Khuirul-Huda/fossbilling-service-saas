name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: sodium, pdo_sqlite, curl, json
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        run: find . -maxdepth 4 -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Run Unit & Integration suites
        run: vendor/bin/pest --configuration=phpunit.xml.dist --test-directory=tests --testsuite=Unit,Integration
